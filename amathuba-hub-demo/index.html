<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amathuba Hub — Attendance Ledger (Demo)</title>
<meta name="theme-color" content="#F5F5F5">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #F5F5F5;
  --surface: #FFFFFF;
  --surface-alt: #ECECEA;
  --ink: #24262A;
  --ink-muted: #6B6C70;
  --accent: #77B23B;
  --accent-dark: #4F7E2A;
  --accent-bright: #3F6621;
  --accent-soft: #E9F2E0;
  --teal: #3F7D74;
  --teal-dark: #2E5F58;
  --danger: #9B3A44;
  --danger-dark: #7C2E36;
  --border: #DADAD7;
  --leave-color: #7C5FA6;
  --compoff-color: #B8863A;
  --swap-color: #4472A8;
  --radius: 10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;color-scheme:light;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  min-height:100vh;
}
#app{max-width:960px;margin:0 auto;padding:0 16px 60px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;flex-direction:column;gap:14px;
  padding:22px 16px 18px;
  margin:0 -16px 24px;
  border-bottom:2px solid var(--accent);
  background:linear-gradient(120deg, var(--accent-soft) 0%, transparent 55%);
}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand-logo{height:40px;width:auto;display:block;}
.brand-tagline{
  font-size:12.5px;color:var(--ink-muted);letter-spacing:0.4px;text-transform:uppercase;
  padding-left:14px;border-left:1px solid var(--border);
  line-height:1.3;
}

.notif-bell{
  position:relative;
  background:none;border:none;cursor:pointer;
  font-size:18px;padding:6px;margin-left:auto;
  color:var(--ink);line-height:1;
}
.notif-badge{
  position:absolute;top:0;right:0;
  background:var(--danger);color:#fff;
  font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  padding:0 3px;
}
.notif-panel{
  position:absolute;top:60px;right:16px;
  width:300px;max-width:calc(100vw - 32px);
  max-height:360px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  z-index:900;
}
.notif-panel.hidden{display:none;}
.notif-item{
  padding:12px 14px;border-bottom:1px solid var(--border);
}
.notif-item:last-child{border-bottom:none;}
.notif-item__msg{font-size:13px;color:var(--ink);line-height:1.4;}
.notif-item__time{font-size:11px;color:var(--ink-muted);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.notif-item--empty{color:var(--ink-muted);font-size:13px;text-align:center;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:13.5px;font-weight:500;
  padding:9px 14px;border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink-muted);
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.tab:hover{border-color:var(--ink-muted);color:var(--ink);}
.tab.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
.tab-admin.active{background:var(--danger-dark);border-color:var(--danger-dark);color:#fff;}
.tab:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--teal); outline-offset:2px;
}

/* ---------- Layout bits ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
}
.card--hero{
  border-top:3px solid var(--accent);
}
.card__title{
  font-family:'Fraunces',serif;font-weight:700;font-size:18px;
  margin:0 0 4px;
}
.card__sub{color:var(--ink-muted);font-size:13.5px;margin:0 0 18px;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.4px;}
select,input[type=date],input[type=time],input[type=datetime-local],input[type=text],input[type=password],textarea{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14.5px;
  padding:11px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface-alt);
  color:var(--ink);
}
textarea{resize:vertical;min-height:70px;font-family:'IBM Plex Sans',sans-serif;}

.btn{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14.5px;font-weight:600;
  padding:12px 20px;border-radius:8px;border:none;
  cursor:pointer;
  transition:transform .08s, opacity .12s;
}
.btn:active{transform:scale(0.98);}
.btn--primary{background:var(--accent-dark);color:#fff;}
.btn--primary:hover{filter:brightness(1.1);}
.btn--teal{background:var(--teal);color:#fff;}
.btn--teal:hover{background:var(--teal-dark);}
.btn--ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
.btn--ghost:hover{border-color:var(--ink-muted);}
.btn--danger{background:var(--danger);color:#fff;}
.btn--danger:hover{background:var(--danger-dark);}
.btn--sm{padding:7px 12px;font-size:12.5px;}
.btn[disabled]{opacity:0.45;cursor:not-allowed;}

.badge{
  display:inline-block;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;letter-spacing:0.3px;
  text-transform:uppercase;
}
.badge--pending{background:#F2E6C9;color:#7A5A17;}
.badge--approved{background:#DCEAE7;color:var(--teal-dark);}
.badge--rejected{background:#F1DBDD;color:var(--danger-dark);}
.badge--late{background:#F1DBDD;color:var(--danger-dark);}
.badge--ontime{background:#DCEAE7;color:var(--teal-dark);}

/* ---------- Clock tab ---------- */
.clock-display{
  font-family:'IBM Plex Mono',monospace;
  text-align:center;padding:6px 0 22px;
  position:relative;
}
.clock-halo{
  position:absolute;
  top:50%;left:50%;
  width:180px;height:180px;
  transform:translate(-50%,-60%);
  background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  z-index:0;
  pointer-events:none;
}
.clock-display .time{position:relative;z-index:1;font-size:42px;font-weight:600;color:var(--ink);letter-spacing:1px;}
.clock-display .date{position:relative;z-index:1;font-size:13.5px;color:var(--ink-muted);margin-top:4px;}

.stamp-btn{
  width:100%;padding:20px;font-size:17px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;
  overflow:visible;
}
.stamp-btn.stamped{animation:stamp .35s ease;}
.stamp-btn.stamped::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:12px;
  border:2px solid var(--accent-dark);
  animation:ringPulse .6s ease-out;
  pointer-events:none;
}
@keyframes stamp{
  0%{transform:scale(1) rotate(0);}
  35%{transform:scale(0.93) rotate(-2deg);}
  100%{transform:scale(1) rotate(0);}
}
@keyframes ringPulse{
  0%{transform:scale(1);opacity:0.9;}
  100%{transform:scale(1.15);opacity:0;}
}

.confirm-note{
  margin-top:14px;padding:12px 14px;border-radius:8px;
  background:var(--surface-alt);font-size:13.5px;color:var(--ink);
  font-family:'IBM Plex Mono',monospace;
}
.location-note{
  margin:10px 0 0;font-size:12px;color:var(--ink-muted);text-align:center;
}
.location-link{
  display:inline-block;margin-top:4px;font-size:12px;
  color:var(--accent-bright);text-decoration:none;font-weight:500;
}
.location-link:hover{text-decoration:underline;}

/* ---------- Admin: System Info / Raw Data ---------- */
.sysinfo-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
  gap:10px;
}
.sysinfo-item{
  background:var(--surface-alt);border-radius:8px;padding:10px 12px;
  display:flex;flex-direction:column;gap:3px;
}
.sysinfo-label{font-size:11px;text-transform:uppercase;letter-spacing:0.3px;color:var(--ink-muted);font-weight:600;}
.sysinfo-value{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);word-break:break-word;}
.raw-data-view{
  background:var(--surface-alt);border-radius:8px;padding:14px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;
  color:var(--ink);overflow-x:auto;max-height:400px;overflow-y:auto;
  margin:14px 0 0;white-space:pre-wrap;word-break:break-word;
}
.training-note{
  padding:14px 16px;border-radius:8px;
  background:var(--accent-soft);color:var(--ink);
  font-size:14px;font-weight:500;text-align:center;
  margin:0;
}

/* ---------- Ledger / list rows ---------- */
.ledger-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px dashed var(--border);
}
.ledger-row:last-child{border-bottom:none;}
.ledger-row__main{display:flex;flex-direction:column;gap:2px;}
.ledger-row__name{font-weight:600;font-size:14px;}
.ledger-row__meta{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-muted);}
.ledger-row__reason{font-size:12.5px;color:var(--ink-muted);margin-top:3px;max-width:420px;}
.ledger-row__actions{display:flex;gap:6px;flex-shrink:0;}
.day-summary{
  margin-bottom:18px;padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
.day-summary:last-child{border-bottom:none;}
.day-summary__head{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  margin-bottom:6px;
}
.day-summary__date{font-family:'Fraunces',serif;font-weight:700;font-size:15px;}
.empty-note{color:var(--ink-muted);font-size:13.5px;padding:10px 0;}

.section-heading{
  font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--ink-muted);margin:26px 0 10px;
}
.section-heading:first-child{margin-top:0;}

.schedule-banner{
  background:var(--accent-soft);
  border-radius:8px;
  padding:12px 16px;
  font-size:13px;
  color:var(--ink);
  margin-bottom:18px;
  display:flex;flex-direction:column;gap:3px;
}
.schedule-banner__label{font-weight:600;color:var(--accent-bright);}
.demo-banner{
  background:var(--accent-soft);
  border:1px solid var(--accent);
  border-radius:8px;
  padding:10px 16px;
  font-size:13px;
  color:var(--ink);
  margin-bottom:20px;
  text-align:center;
}
.demo-banner code{
  background:var(--surface-alt);
  padding:2px 6px;
  border-radius:4px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
}
.schedule-banner__warning{
  margin-top:6px;padding:8px 10px;border-radius:6px;
  background:#F1DBDD;color:var(--danger-dark);font-size:12.5px;font-weight:500;
}
.schedule-note{
  font-size:13px;color:var(--ink-muted);margin:0 0 16px;
}
.schedule-note strong{color:var(--accent-bright);}

/* ---------- Team Calendar ---------- */
.cal-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.cal-nav{display:flex;align-items:center;gap:8px;}
.cal-nav__label{font-family:'Fraunces',serif;font-weight:700;font-size:16px;min-width:130px;text-align:center;}

.cal-legend{
  display:flex;flex-wrap:wrap;gap:12px 18px;
  margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);
}
.cal-legend__item{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--ink-muted);
}
.cal-legend__swatch{
  width:12px;height:12px;border-radius:3px;flex-shrink:0;
}
.cal-legend__swatch--groupA{background:var(--accent);}
.cal-legend__swatch--groupB{background:var(--teal);}
.cal-legend__swatch--training{background:var(--danger);}
.cal-legend__swatch--leave{background:var(--leave-color);}
.cal-legend__swatch--compoff{background:var(--compoff-color);}
.cal-legend__swatch--swap{background:var(--swap-color);}

.cal-weekday-row{display:grid;grid-template-columns:repeat(7, 1fr);gap:0;margin-bottom:4px;}
.cal-weekday{
  text-align:left;font-size:11px;font-weight:600;color:var(--ink-muted);
  text-transform:uppercase;letter-spacing:0.3px;padding:0 4px 4px;
}

.cal-week{border:1px solid var(--border);border-top:none;}
.cal-week:first-of-type{border-top:1px solid var(--border);}
.cal-week__daynums{display:grid;grid-template-columns:repeat(7, 1fr);}
.cal-daynum{
  min-height:34px;
  border-right:1px solid var(--border);
  padding:5px 6px 2px;
  font-family:'IBM Plex Sans',sans-serif;
  display:flex;flex-direction:column;
  background:var(--surface);
}
.cal-daynum:last-child{border-right:none;}
.cal-daynum__num{font-size:17px;font-weight:700;color:var(--ink);line-height:1;}
.cal-daynum--otherMonth .cal-daynum__num{color:var(--ink-muted);opacity:0.4;}
.cal-daynum--weekend{background:#FBF6E3;}
.cal-daynum--holiday{background:#FBF6E3;}
.cal-daynum--holiday .cal-daynum__num{color:var(--danger-dark);}
.cal-daynum__holiday-label{font-size:10px;color:var(--danger-dark);font-weight:600;margin-top:2px;line-height:1.2;}
.cal-daynum--today{box-shadow:inset 0 0 0 2px var(--accent-dark);}

.cal-week__events{
  display:grid;grid-template-columns:repeat(7, 1fr);
  grid-auto-rows:21px;
  gap:2px 0;
  padding:2px 0;
}
.cal-event-bar{
  font-size:10.5px;font-weight:500;color:#fff;
  padding:2px 7px;margin:0 1px;border-radius:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;height:19px;
}
.cal-event-bar--training{background:var(--danger);}
.cal-event-bar--leave{background:var(--leave-color);}
.cal-event-bar--compoff{background:var(--compoff-color);color:#3D2D06;}
.cal-event-bar--swap{background:var(--swap-color);}
.cal-event-bar--groupA{background:var(--accent);}
.cal-event-bar--groupB{background:var(--teal);}
.cal-event-bar--pending{
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0 6px, transparent 6px 12px);
}

@media (max-width: 560px){
  .cal-daynum__num{font-size:15px;}
  .cal-event-bar{font-size:9.5px;}
  .cal-nav__label{min-width:100px;font-size:14px;}
  .cal-legend{gap:8px 12px;}
  .cal-legend__item{font-size:11px;}
}
.pin-gate{max-width:320px;margin:0 auto;text-align:center;}
.pin-gate .card__title{text-align:center;}

.emp-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface-alt);border-radius:999px;
  padding:6px 6px 6px 14px;font-size:13.5px;margin:4px 6px 4px 0;
}
.emp-chip button{
  border:none;background:var(--danger-dark);color:#fff;border-radius:50%;
  width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;
}

.danger-zone{border:1px solid var(--danger);border-radius:var(--radius);padding:18px;background:rgba(180,82,93,0.12);}
.danger-zone .card__title{color:var(--danger);}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(38,40,42,0.45);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;
  padding:20px;
}
.modal-overlay.hidden{display:none;}
.modal-box{
  background:var(--surface);
  border-radius:var(--radius);
  padding:24px;
  max-width:380px;
  width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}
.modal-box p{margin:0 0 16px;font-size:14.5px;color:var(--ink);line-height:1.4;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}

@media (prefers-reduced-motion: reduce){
  .stamp-btn.stamped, .stamp-btn.stamped::after{animation:none;}
  .btn{transition:none;}
}

@media (max-width: 560px){
  .brand-logo{height:32px;}
  .brand-tagline{padding-left:0;border-left:none;flex-basis:100%;}
  .clock-display .time{font-size:32px;}
  .card{padding:18px;}
  .ledger-row{flex-direction:column;align-items:flex-start;}
  .ledger-row__actions{align-self:flex-end;}
}
</style>
</head>

// ---------------- Storage helpers (in-memory demo store) ----------------
async function getData(key, fallback){
  return (key in DEMO_STORE) ? JSON.parse(JSON.stringify(DEMO_STORE[key])) : fallback;
}
async function setData(key, value){
  DEMO_STORE[key] = JSON.parse(JSON.stringify(value));
  return true;
}

async function loadState(){
  const [employeesRaw, attendance, swaps, leave, settingsRaw] = await Promise.all([
    getData(KEY_EMPLOYEES, null),
    getData(KEY_ATTENDANCE, []),
    getData(KEY_SWAPS, []),
    getData(KEY_LEAVE, []),
    getData(KEY_SETTINGS, null)
  ]);
  let employees = employeesRaw;
  if(employees === null){
    employees = DEFAULT_EMPLOYEES.slice();
    await setData(KEY_EMPLOYEES, employees);
  }
  let settings = settingsRaw;
  if(settings === null){
    settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    await setData(KEY_SETTINGS, settings);
  } else {
    // fill in any new fields older saved settings might be missing
    settings = Object.assign({}, DEFAULT_SETTINGS, settings);
  }
  state = { employees, attendance, swaps, leave, settings };
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

// Captures location once, only at the moment of clock in/out — never runs
// in the background. Resolves to {lat, lng, accuracy} or null if unavailable,
// denied, or slow (8s timeout so a clock-in is never blocked by GPS).
function captureLocationOnce(){
  return new Promise((resolve)=>{
    if(!('geolocation' in navigator)){ resolve(null); return; }
    const timer = setTimeout(()=> resolve(null), 12000);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        clearTimeout(timer);
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: Math.round(pos.coords.accuracy)
        });
      },
      ()=>{ clearTimeout(timer); resolve(null); },
      { enableHighAccuracy: false, timeout: 11000, maximumAge: 60000 }
    );
  });
}

// ---------------- Custom modal (replaces confirm/prompt/alert, which are
// blocked in some sandboxed preview contexts) ----------------
let modalState = { resolve: null, isPrompt: false };

function openModal({ message, isPrompt = false, defaultValue = '', confirmLabel = 'Confirm', danger = true, hideCancel = false }){
  return new Promise(resolve=>{
    modalState.resolve = resolve;
    modalState.isPrompt = isPrompt;
    document.getElementById('modalMessage').textContent = message;
    const wrap = document.getElementById('modalInputWrap');
    const input = document.getElementById('modalInput');
    if(isPrompt){
      wrap.style.display = 'block';
      input.value = defaultValue;
      setTimeout(()=>input.focus(), 50);
    } else {
      wrap.style.display = 'none';
    }
    const confirmBtn = document.getElementById('modalConfirmBtn');
    confirmBtn.textContent = confirmLabel;
    confirmBtn.className = 'btn ' + (danger ? 'btn--danger' : 'btn--primary');
    const cancelBtn = document.getElementById('modalCancelBtn');
    cancelBtn.style.display = hideCancel ? 'none' : 'inline-block';
    document.getElementById('modalOverlay').classList.remove('hidden');
  });
}

function closeModal(result){
  document.getElementById('modalOverlay').classList.add('hidden');
  if(modalState.resolve) modalState.resolve(result);
  modalState.resolve = null;
}

function askConfirm(message, confirmLabel = 'Confirm'){
  return openModal({ message, isPrompt: false, confirmLabel, danger: true });
}
function askPrompt(message, defaultValue = ''){
  return openModal({ message, isPrompt: true, defaultValue, confirmLabel: 'Save', danger: false });
}
function showAlert(message){
  return openModal({ message, isPrompt: false, confirmLabel: 'OK', danger: false, hideCancel: true });
}

function locationLinkHtml(location){
  if(!location) return '';
  const url = `https://www.google.com/maps?q=${location.lat},${location.lng}`;
  return `<a href="${url}" target="_blank" rel="noopener" class="location-link">📍 View location (±${location.accuracy}m)</a>`;
}

function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' }) +
    "  " + d.toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
}
function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
}

function lastRecordFor(name){
  const rows = state.attendance.filter(r => r.name === name);
  return rows.length ? rows[rows.length - 1] : null;
}

// Groups an employee's attendance into calendar days and sums worked hours
// per day by pairing consecutive clock-in/clock-out records.
function computeDailySummary(name){
  const recs = state.attendance.filter(r=>r.name===name).slice().sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  const byDate = {};
  recs.forEach(r=>{
    const dateKey = toISODateLocal(new Date(r.ts));
    if(!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push(r);
  });
  const summaries = Object.keys(byDate).sort().reverse().map(dateKey=>{
    const dayRecs = byDate[dateKey];
    let totalMs = 0;
    let openIn = null;
    dayRecs.forEach(r=>{
      if(r.type === 'in'){ openIn = r; }
      else if(r.type === 'out' && openIn){
        totalMs += (new Date(r.ts) - new Date(openIn.ts));
        openIn = null;
      }
    });
    const stillClockedIn = openIn !== null;
    const totalHours = totalMs / (1000*60*60);
    return {
      date: dateKey,
      totalHours,
      met: totalHours >= REQUIRED_HOURS,
      stillClockedIn,
      records: dayRecs
    };
  });
  return summaries;
}

function formatHours(h){
  const hrs = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  return `${hrs}h ${mins}m`;
}

function isLateNow(){
  const now = new Date();
  const [h, m] = (state.settings.startTime || "08:00").split(":").map(Number);
  const threshold = new Date(now);
  threshold.setHours(h, m, 0, 0);
  return now > threshold;
}

// ---------------- Weekend / public holiday blocking ----------------
function isWeekendDate(date){
  const dow = date.getDay();
  return dow === 0 || dow === 6;
}
function getPublicHoliday(dateStr){
  return (state.settings.publicHolidays || []).find(h => h.date === dateStr) || null;
}
function isNonWorkingDay(date){
  const dateStr = toISODateLocal(date);
  return isWeekendDate(date) || !!getPublicHoliday(dateStr);
}
function nonWorkingDayLabel(date){
  const dateStr = toISODateLocal(date);
  const holiday = getPublicHoliday(dateStr);
  if(holiday) return `Public Holiday — ${holiday.name}`;
  if(isWeekendDate(date)) return 'Weekend';
  return null;
}

// ---------------- Hybrid schedule helpers ----------------
function mondayOf(date){
  const d = new Date(date);
  const day = d.getDay(); // 0 = Sun
  const diff = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function isGroupAMWFForWeek(date){
  const anchor = new Date(state.settings.scheduleAnchorMonday + "T00:00:00");
  const weekMonday = mondayOf(date);
  const weeksDiff = Math.round((weekMonday - anchor) / (7*24*60*60*1000));
  const flipped = ((weeksDiff % 2) + 2) % 2 === 1;
  return flipped ? !state.settings.anchorGroupAIsMWF : state.settings.anchorGroupAIsMWF;
}

function officeGroupsForDate(date){
  const dow = date.getDay(); // 1=Mon..5=Fri
  const groupAisMWF = isGroupAMWFForWeek(date);
  if(dow === 1 || dow === 3 || dow === 5){
    return groupAisMWF ? { inOffice: GROUP_A, remote: GROUP_B } : { inOffice: GROUP_B, remote: GROUP_A };
  }
  if(dow === 2 || dow === 4){
    return groupAisMWF ? { inOffice: GROUP_B, remote: GROUP_A } : { inOffice: GROUP_A, remote: GROUP_B };
  }
  return { inOffice: [], remote: [] };
}

function toISODateLocal(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ---------------- DD/MM/YYYY date field helpers (used by Leave tab) ----------------
// Auto-inserts slashes as the person types: 27 -> 27/ -> 27/07 -> 27/07/2026
function applyDateMask(inputEl){
  inputEl.addEventListener('input', ()=>{
    let digits = inputEl.value.replace(/\D/g, '').slice(0, 8);
    let out = digits.slice(0,2);
    if(digits.length > 2) out += '/' + digits.slice(2,4);
    if(digits.length > 4) out += '/' + digits.slice(4,8);
    inputEl.value = out;
  });
}

// Parses "DD/MM/YYYY" into an ISO "YYYY-MM-DD" string, or null if invalid.
function parseDDMMYYYY(str){
  const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str || '').trim());
  if(!match) return null;
  const day = parseInt(match[1], 10);
  const month = parseInt(match[2], 10);
  const year = parseInt(match[3], 10);
  if(month < 1 || month > 12 || day < 1 || day > 31 || year < 2000 || year > 2100) return null;
  const d = new Date(year, month - 1, day);
  if(d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null; // rejects e.g. 31/02
  return toISODateLocal(d);
}

// Formats an ISO "YYYY-MM-DD" string into "DD/MM/YYYY" for display in editable fields.
function isoToDDMMYYYY(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// ---------------- Skills training overrides ----------------
function nextWeekday(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + 1);
  while(d.getDay() === 0 || d.getDay() === 6){ d.setDate(d.getDate() + 1); }
  return toISODateLocal(d);
}

// Checks whether, once `group`'s members are excluded, anyone is still
// scheduled in the office on `dateStr` per the normal hybrid rotation.
function hasCoverageExcluding(dateStr, excludeGroup){
  const d = new Date(dateStr + "T00:00:00");
  const { inOffice } = officeGroupsForDate(d);
  return inOffice.filter(n => !excludeGroup.includes(n)).length > 0;
}

// Returns 'training', 'comp-off', 'comp-blocked', or null for a given
// employee on a given date, based on the hardcoded skills training blocks.
function getTrainingStatus(name, dateStr){
  for(const block of SKILLS_BLOCKS){
    if(block.group1Dates.includes(dateStr) && SKILLS_GROUP_1.includes(name)) return 'training';
    if(block.group2Dates.includes(dateStr) && SKILLS_GROUP_2.includes(name)) return 'training';

    const group1CompDay = block.group2Dates[0]; // Group 2's first training day — always covered
    if(dateStr === group1CompDay && SKILLS_GROUP_1.includes(name)) return 'comp-off';

    const group2CompDay = nextWeekday(block.group2Dates[block.group2Dates.length - 1]);
    if(dateStr === group2CompDay && SKILLS_GROUP_2.includes(name)){
      return hasCoverageExcluding(dateStr, SKILLS_GROUP_2) ? 'comp-off' : 'comp-blocked';
    }
  }
  return null;
}

// Merges the normal hybrid in-office/remote split with skills-training
// overrides (training days, comp days off, and blocked comp days).
function isOnLeave(name, dateStr){
  return state.leave.some(l => l.name === name && dateStr >= l.startDate && dateStr <= l.endDate);
}

function officeStatusForDate(date){
  const dateStr = toISODateLocal(date);
  const base = officeGroupsForDate(date);
  let inOffice = base.inOffice.slice();
  let remote = base.remote.slice();
  const training = [];
  const compOff = [];
  const compBlocked = [];
  const onLeave = [];

  state.employees.forEach(name=>{
    if(isOnLeave(name, dateStr)){
      onLeave.push(name);
      inOffice = inOffice.filter(n=>n!==name);
      remote = remote.filter(n=>n!==name);
      return; // leave overrides training/comp-off — they're simply out
    }
    const status = getTrainingStatus(name, dateStr);
    if(status === 'training'){
      training.push(name);
      inOffice = inOffice.filter(n=>n!==name);
      remote = remote.filter(n=>n!==name);
    } else if(status === 'comp-off'){
      compOff.push(name);
      inOffice = inOffice.filter(n=>n!==name);
      remote = remote.filter(n=>n!==name);
    } else if(status === 'comp-blocked'){
      compBlocked.push(name);
    }
  });

  return { inOffice, remote, training, compOff, compBlocked, onLeave };
}

// Returns the next `count` weekday dates (YYYY-MM-DD) where `name` is scheduled
// in office (wantOffice=true) or scheduled remote (wantOffice=false).
function upcomingScheduleDates(name, wantOffice, count){
  const results = [];
  let d = new Date();
  d.setHours(0,0,0,0);
  let guard = 0;
  while(results.length < count && guard < 120){
    const dow = d.getDay();
    if(dow >= 1 && dow <= 5){
      const { inOffice } = officeGroupsForDate(d);
      const isOfficeDay = inOffice.includes(name);
      if(isOfficeDay === wantOffice){
        results.push(toISODateLocal(d));
      }
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  return results;
}

function personalWeekScheduleLabel(name){
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  const today = new Date();
  const monday = mondayOf(today);
  const officeDays = [];
  for(let i=0;i<5;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const { inOffice } = officeGroupsForDate(d);
    if(inOffice.includes(name)) officeDays.push(days[i]);
  }
  return officeDays.length ? officeDays.join('/') : 'none';
}

  }

// ---------------- Team Calendar ----------------
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAY_LABELS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// Splits a sorted array of "YYYY-MM-DD" strings into runs of consecutive
// calendar days, so a training block like Fri,Mon,Tue,Wed (skipping the
// weekend) becomes two separate segments instead of one bar spanning through
// the weekend.
function splitIntoContiguousRuns(dates){
  const runs = [];
  let runStart = dates[0], prev = dates[0];
  for(let i=1; i<dates.length; i++){
    const prevDate = new Date(prev + "T00:00:00");
    const expectedNext = new Date(prevDate);
    expectedNext.setDate(expectedNext.getDate() + 1);
    if(toISODateLocal(expectedNext) !== dates[i]){
      runs.push({ start: runStart, end: prev });
      runStart = dates[i];
    }
    prev = dates[i];
  }
  runs.push({ start: runStart, end: prev });
  return runs;
}

// Builds a flat list of {startDate, endDate, label, colorClass, pending}
// events for the currently visible calendar range (with some padding).
function buildCalendarEvents(rangeStart, rangeEnd){
  const events = [];

  // Hybrid office rotation, shown as a bar per working day — same treatment
  // as training, just tagged isGroupEvent so it always claims the top lane.
  let d = new Date(rangeStart + "T00:00:00");
  const endD = new Date(rangeEnd + "T00:00:00");
  while(d <= endD){
    if(!isNonWorkingDay(d)){
      const ds = toISODateLocal(d);
      const base = officeGroupsForDate(d);
      const isGroupA = base.inOffice.some(n => GROUP_A.includes(n));
      events.push({
        startDate: ds, endDate: ds,
        label: isGroupA ? 'Group A' : 'Group B',
        colorClass: isGroupA ? 'groupA' : 'groupB',
        pending: false, isGroupEvent: true
      });
    }
    d.setDate(d.getDate() + 1);
  }

  SKILLS_BLOCKS.forEach(block=>{
    splitIntoContiguousRuns(block.group1Dates).forEach(run=>{
      if(run.end >= rangeStart && run.start <= rangeEnd){
        events.push({ startDate:run.start, endDate:run.end, label:'Group 1 Training', colorClass:'training', pending:false });
      }
    });
    splitIntoContiguousRuns(block.group2Dates).forEach(run=>{
      if(run.end >= rangeStart && run.start <= rangeEnd){
        events.push({ startDate:run.start, endDate:run.end, label:'Group 2 Training', colorClass:'training', pending:false });
      }
    });
    const g1CompDay = block.group2Dates[0];
    if(g1CompDay >= rangeStart && g1CompDay <= rangeEnd){
      events.push({ startDate:g1CompDay, endDate:g1CompDay, label:'Group 1 Comp Off', colorClass:'compoff', pending:false });
    }
    const g2CompDay = nextWeekday(block.group2Dates[block.group2Dates.length-1]);
    if(g2CompDay >= rangeStart && g2CompDay <= rangeEnd && hasCoverageExcluding(g2CompDay, SKILLS_GROUP_2)){
      events.push({ startDate:g2CompDay, endDate:g2CompDay, label:'Group 2 Comp Off', colorClass:'compoff', pending:false });
    }
  });

  state.leave.forEach(l=>{
    if(l.endDate >= rangeStart && l.startDate <= rangeEnd){
      events.push({ startDate:l.startDate, endDate:l.endDate, label:l.name, colorClass:'leave', pending:false });
    }
  });

  state.swaps.forEach(s=>{
    if(s.status === 'rejected') return;
    if(s.toDate >= rangeStart && s.toDate <= rangeEnd){
      events.push({ startDate:s.toDate, endDate:s.toDate, label:`${s.name} (Swap)`, colorClass:'swap', pending: s.status==='pending' });
    }
  });

  return events;
}

// Greedy interval-lane assignment so overlapping bars stack, non-overlapping share a row.
function assignLanes(weekEvents){
  const lanes = []; // lanes[i] = end colIndex of the last event placed in that lane
  return weekEvents.map(ev=>{
    let lane = lanes.findIndex(endCol => endCol <= ev.colStart);
    if(lane === -1){ lane = lanes.length; lanes.push(ev.colEnd); }
    else{ lanes[lane] = ev.colEnd; }
    return Object.assign({}, ev, { lane });
  });
}

function renderTeamCalendar(){
  const year = calendarViewYear;
  const month = calendarViewMonth; // 0-indexed
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = toISODateLocal(new Date());
  const thisMonth = month;

  // Build the full grid of weeks (each a 7-day array), including
  // leading/trailing days from adjacent months for a complete grid.
  const gridStart = new Date(year, month, 1 - startOffset);
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const weeks = [];
  for(let w=0; w<totalCells/7; w++){
    const week = [];
    for(let d=0; d<7; d++){
      const date = new Date(gridStart);
      date.setDate(gridStart.getDate() + w*7 + d);
      week.push(date);
    }
    weeks.push(week);
  }

  const rangeStart = toISODateLocal(weeks[0][0]);
  const rangeEnd = toISODateLocal(weeks[weeks.length-1][6]);
  const allEvents = buildCalendarEvents(rangeStart, rangeEnd);

  const weeksHtml = weeks.map(week=>{
    const weekStart = toISODateLocal(week[0]);
    const weekEnd = toISODateLocal(week[6]);

    const daynumsHtml = week.map(date=>{
      const dateStr = toISODateLocal(date);
      const dow = date.getDay();
      const isWeekend = (dow === 0 || dow === 6);
      const holiday = getPublicHoliday(dateStr);
      const isOtherMonth = date.getMonth() !== thisMonth;
      const isToday = dateStr === todayStr;
      let classes = 'cal-daynum';
      if(isOtherMonth) classes += ' cal-daynum--otherMonth';
      if(isToday) classes += ' cal-daynum--today';
      if(holiday) classes += ' cal-daynum--holiday';
      else if(isWeekend) classes += ' cal-daynum--weekend';
      return `
        <div class="${classes}">
          <span class="cal-daynum__num">${date.getDate()}</span>
          ${holiday ? `<span class="cal-daynum__holiday-label">${escapeHtml(holiday.name)}</span>` : ''}
        </div>
      `;
    }).join('');

    const weekEvents = allEvents
      .filter(ev => ev.endDate >= weekStart && ev.startDate <= weekEnd)
      .map(ev=>{
        const clippedStart = ev.startDate < weekStart ? weekStart : ev.startDate;
        const clippedEnd = ev.endDate > weekEnd ? weekEnd : ev.endDate;
        const colStart = Math.round((new Date(clippedStart+"T00:00:00") - week[0]) / 86400000);
        const colEnd = Math.round((new Date(clippedEnd+"T00:00:00") - week[0]) / 86400000) + 1;
        return Object.assign({}, ev, { colStart, colEnd });
      })
      .sort((a,b)=> (b.isGroupEvent?1:0) - (a.isGroupEvent?1:0) || a.colStart - b.colStart);

    const laned = assignLanes(weekEvents);
    const maxLane = laned.reduce((m,ev)=> Math.max(m, ev.lane), -1);

    const eventsHtml = laned.map(ev=>`
      <div class="cal-event-bar cal-event-bar--${ev.colorClass} ${ev.pending ? 'cal-event-bar--pending' : ''}"
           style="grid-column:${ev.colStart+1} / ${ev.colEnd+1}; grid-row:${ev.lane+1};"
           title="${escapeHtml(ev.label)}${ev.pending ? ' (pending)' : ''}">
        ${escapeHtml(ev.label)}${ev.pending ? ' (pending)' : ''}
      </div>
    `).join('');

    return `
      <div class="cal-week">
        <div class="cal-week__daynums">${daynumsHtml}</div>
        ${maxLane >= 0 ? `<div class="cal-week__events" style="grid-template-rows:repeat(${maxLane+1}, 21px);">${eventsHtml}</div>` : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="card">
      <div class="cal-header">
        <h2 class="card__title">Team Calendar</h2>
        <div class="cal-nav">
          <button class="btn btn--ghost btn--sm" id="calPrevBtn">‹</button>
          <span class="cal-nav__label">${MONTH_NAMES[month]} ${year}</span>
          <button class="btn btn--ghost btn--sm" id="calNextBtn">›</button>
          <button class="btn btn--ghost btn--sm" id="calTodayBtn">Today</button>
        </div>

function tickClock(){
  const now = new Date();
  const t = document.getElementById('liveClock');
  const d = document.getElementById('liveDate');
  if(t) t.textContent = now.toLocaleTimeString('en-ZA', { hour12:false });
  if(d) d.textContent = now.toLocaleDateString('en-ZA', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}
setInterval(tickClock, 1000);

function formatScheduleOption(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString('en-ZA', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
}

          <span class="ledger-row__meta">${fmtDateTime(r.ts)}</span>
          <span class="ledger-row__reason">${escapeHtml(r.reason)}</span>

          <button class="btn btn--teal btn--sm" data-approve-late="${r.id}">Approve</button>

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Notifications (live, in-app only) ----------------
const LAST_SEEN_NOTIF_KEY = 'amathuba_last_seen_notif';

async function pushNotification(message){
  const notif = { id: uid(), message, createdAt: new Date().toISOString() };
  const updated = [...notifications, notif].slice(-50); // keep the last 50
  await setData(KEY_NOTIFICATIONS, updated);
  notifications = updated; // demo has no live listener, so update local state directly
  updateNotifBadge();
  const panel = document.getElementById('notifPanel');
  if(panel && !panel.classList.contains('hidden')) renderNotifPanel();
}

function getLastSeenNotif(){
  try{ return localStorage.getItem(LAST_SEEN_NOTIF_KEY) || '1970-01-01T00:00:00.000Z'; }
  catch(e){ return '1970-01-01T00:00:00.000Z'; }
}
function setLastSeenNotifNow(){
  try{ localStorage.setItem(LAST_SEEN_NOTIF_KEY, new Date().toISOString()); }
  catch(e){ /* localStorage unavailable — badge just won't persist across reloads */ }
}

function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const lastSeen = getLastSeenNotif();
  const unread = notifications.filter(n => n.createdAt > lastSeen).length;
  if(unread > 0){
    badge.textContent = unread > 9 ? '9+' : String(unread);
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function renderNotifPanel(){
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  const sorted = notifications.slice().sort((a,b)=> b.createdAt.localeCompare(a.createdAt)).slice(0, 20);
  panel.innerHTML = sorted.length ? sorted.map(n=>`
    <div class="notif-item">
      <div class="notif-item__msg">${escapeHtml(n.message)}</div>
      <div class="notif-item__time">${fmtDateTime(n.createdAt)}</div>
    </div>
  `).join('') : `<div class="notif-item notif-item--empty">No notifications yet.</div>`;
}

// Demo build has no real backend, so there's no live cross-device listener —
// notifications just update locally the moment they're triggered (see pushNotification above).
function startNotificationsListener(){
  updateNotifBadge();
}

// ---------------- Event handlers (delegated per-tab) ----------------
function attachHandlers(){
  if(activeTab === 'clock'){
    const empSelect = document.getElementById('empSelect');
    if(empSelect){
      empSelect.addEventListener('change', (e)=>{
        selectedEmployee = e.target.value;
        render();
        // Warm up location now (triggers the permission prompt early, with no
        // time pressure) so the actual clock-in/out click resolves fast.
        if('geolocation' in navigator){
          navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, { enableHighAccuracy:false, timeout:15000, maximumAge:60000 });
        }
      });
    }
    const actionBtn = document.getElementById('clockActionBtn');
    if(actionBtn){
      actionBtn.addEventListener('click', async ()=>{
        const action = actionBtn.dataset.action;
        const late = actionBtn.dataset.late === '1';
        let reason = null;
        if(late){
          const reasonEl = document.getElementById('lateReason');
          reason = reasonEl ? reasonEl.value.trim() : '';
          if(!reason){
            reasonEl.style.borderColor = 'var(--danger)';
            reasonEl.focus();
            return;
          }
        }
        actionBtn.disabled = true;
        actionBtn.textContent = 'Getting location…';
        const location = await captureLocationOnce();
        const record = {
          id: uid(),
          name: selectedEmployee,
          type: action,
          ts: new Date().toISOString(),
          late: late,
          reason: reason,
          reasonStatus: late ? 'pending' : null,
          location: location // {lat, lng, accuracy} or null — captured only at this instant
        };
        state.attendance.push(record);
        await setData(KEY_ATTENDANCE, state.attendance);
        actionBtn.classList.add('stamped');
        document.getElementById('clockConfirm').innerHTML =
          `<div class="confirm-note">Stamped: ${record.type === 'in' ? 'Clock-In' : 'Clock-Out'} at ${fmtDateTime(record.ts)}</div>`;
        setTimeout(()=>render(), 700);
      });
    }

    const calPrevBtn = document.getElementById('calPrevBtn');
    if(calPrevBtn){
      calPrevBtn.addEventListener('click', ()=>{
        calendarViewMonth--;
        if(calendarViewMonth < 0){ calendarViewMonth = 11; calendarViewYear--; }
        render();
      });
    }
    const calNextBtn = document.getElementById('calNextBtn');
    if(calNextBtn){
      calNextBtn.addEventListener('click', ()=>{
        calendarViewMonth++;
        if(calendarViewMonth > 11){ calendarViewMonth = 0; calendarViewYear++; }
        render();
      });
    }
    const calTodayBtn = document.getElementById('calTodayBtn');
    if(calTodayBtn){
      calTodayBtn.addEventListener('click', ()=>{
        const today = new Date();
        calendarViewYear = today.getFullYear();
        calendarViewMonth = today.getMonth();
        render();
      });
    }
  }

  if(activeTab === 'swap'){
    const sel = document.getElementById('swapEmpSelect');
    if(sel){
      sel.addEventListener('change', (e)=>{ swapEmployee = e.target.value; render(); });
    }
    const submitBtn = document.getElementById('submitSwapBtn');
    if(submitBtn){
      submitBtn.addEventListener('click', async ()=>{
        const name = document.getElementById('swapEmpSelect').value;
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        const reason = document.getElementById('swapReason').value.trim();
        if(!name || !from || !to || !reason){
          await showAlert('Please fill in your name, both dates, and a reason.');
          return;
        }
        submitBtn.disabled = true;
        state.swaps.push({
          id: uid(), name, fromDate: from, toDate: to, reason,
          status: 'pending', requestedAt: new Date().toISOString()
        });
        await setData(KEY_SWAPS, state.swaps);
        await pushNotification(`${name} requested a day swap: off ${fmtDate(from)} → in ${fmtDate(to)}`);
        swapEmployee = name;
        render();
      });
    }
  }

  if(activeTab === 'leave'){
    const sel = document.getElementById('leaveEmpSelect');
    if(sel){
      sel.addEventListener('change', (e)=>{ leaveEmployee = e.target.value; render(); });
    }
    const leaveFromEl = document.getElementById('leaveFromDate');
    if(leaveFromEl) applyDateMask(leaveFromEl);
    const leaveToEl = document.getElementById('leaveToDate');
    if(leaveToEl) applyDateMask(leaveToEl);

    const submitBtn = document.getElementById('submitLeaveBtn');
    if(submitBtn){
      submitBtn.addEventListener('click', async ()=>{
        const name = document.getElementById('leaveEmpSelect').value;
        const fromRaw = document.getElementById('leaveFromDate').value;
        const toRaw = document.getElementById('leaveToDate').value;
        const reason = document.getElementById('leaveReason').value.trim();
        if(!name || !fromRaw || !toRaw || !reason){
          await showAlert('Please fill in your name, both dates, and a reason.');
          return;
        }
        const from = parseDDMMYYYY(fromRaw);
        const to = parseDDMMYYYY(toRaw);
        if(!from || !to){
          await showAlert('Please enter both dates as DD/MM/YYYY (e.g. 27/07/2026).');
          return;
        }
        if(to < from){
          await showAlert('Last day out cannot be before the first day out.');
          return;
        }
        submitBtn.disabled = true;
        state.leave.push({
          id: uid(), name, startDate: from, endDate: to, reason,
          submittedAt: new Date().toISOString()
        });
        await setData(KEY_LEAVE, state.leave);
        const rangeLabel = from === to ? fmtDate(from) : `${fmtDate(from)} → ${fmtDate(to)}`;
        await pushNotification(`${name} logged leave: ${rangeLabel}`);
        leaveEmployee = name;
        render();
      });
    }
  }

  if(activeTab === 'history'){
    const sel = document.getElementById('historyEmpSelect');
    if(sel){
      sel.addEventListener('change', (e)=>{ historyEmployee = e.target.value; render(); });
    }
  }

  if(activeTab === 'manager'){
    const unlockBtn = document.getElementById('managerUnlockBtn');
    if(unlockBtn){
      unlockBtn.addEventListener('click', ()=>{
        const name = document.getElementById('managerNameInput').value;
        const val = document.getElementById('managerPinInput').value;
        if(name && state.settings.managers[name] && val === state.settings.managers[name]){
          managerUnlocked = true;
          managerName = name;
          render();
        } else {
          document.getElementById('managerPinError').textContent = 'Incorrect name or PIN.';
        }
      });
    }
    const lockBtn = document.getElementById('managerLockBtn');
    if(lockBtn){
      lockBtn.addEventListener('click', ()=>{ managerUnlocked = false; managerName = ""; render(); });
    }
    attachApprovalHandlers();
  }

  if(activeTab === 'settings'){
    const unlockBtn = document.getElementById('settingsUnlockBtn');
    if(unlockBtn){
      unlockBtn.addEventListener('click', ()=>{
        const val = document.getElementById('settingsPinInput').value;
        if(val === state.settings.settingsPin){ settingsUnlocked = true; render(); }
        else{ document.getElementById('settingsPinError').textContent = 'Incorrect PIN.'; }
      });
    }
    const lockBtn = document.getElementById('settingsLockBtn');
    if(lockBtn){
      lockBtn.addEventListener('click', ()=>{ settingsUnlocked = false; render(); });
    }
    const addBtn = document.getElementById('addEmpBtn');
    if(addBtn){
      addBtn.addEventListener('click', async ()=>{
        const input = document.getElementById('newEmpInput');
        const name = input.value.trim();
        if(!name) return;
        if(state.employees.includes(name)){ await showAlert('That name is already on the list.'); return; }
        state.employees.push(name);
        await setData(KEY_EMPLOYEES, state.employees);
        render();
      });
    }
    document.querySelectorAll('[data-remove-emp]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const name = btn.dataset.removeEmp;
        if(!(await askConfirm(`Remove ${name} from the employee list? Their past records stay in the log.`, 'Remove'))) return;
        state.employees = state.employees.filter(n=>n!==name);
        await setData(KEY_EMPLOYEES, state.employees);
        render();
      });
    });
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    if(saveSettingsBtn){
      saveSettingsBtn.addEventListener('click', async ()=>{
        const val = document.getElementById('startTimeInput').value;
        if(!val) return;
        state.settings.startTime = val;
        await setData(KEY_SETTINGS, state.settings);
        render();
      });
    }
    const saveScheduleBtn = document.getElementById('saveScheduleBtn');
    if(saveScheduleBtn){
      saveScheduleBtn.addEventListener('click', async ()=>{
        const dateVal = document.getElementById('anchorMondayInput').value;
        const groupVal = document.getElementById('anchorGroupInput').value;
        if(!dateVal) return;
        const dow = new Date(dateVal + "T00:00:00").getDay();
        if(dow !== 1){
          await showAlert('Please pick a Monday for the reference date.');
          return;
        }
        state.settings.scheduleAnchorMonday = dateVal;
        state.settings.anchorGroupAIsMWF = (groupVal === 'true');
        await setData(KEY_SETTINGS, state.settings);
        render();
      });
    }

    const newHolidayDateEl = document.getElementById('newHolidayDate');
    if(newHolidayDateEl) applyDateMask(newHolidayDateEl);
    const addHolidayBtn = document.getElementById('addHolidayBtn');
    if(addHolidayBtn){
      addHolidayBtn.addEventListener('click', async ()=>{
        const dateRaw = document.getElementById('newHolidayDate').value;
        const name = document.getElementById('newHolidayName').value.trim();
        if(!dateRaw || !name){
          await showAlert('Please enter both a date and a name for the holiday.');
          return;
        }
        const parsed = parseDDMMYYYY(dateRaw);
        if(!parsed){
          await showAlert('Please enter the date as DD/MM/YYYY (e.g. 24/09/2026).');
          return;
        }
        if(!state.settings.publicHolidays) state.settings.publicHolidays = [];
        if(state.settings.publicHolidays.some(h=>h.date===parsed)){
          await showAlert('That date is already in the list.');
          return;
        }
        state.settings.publicHolidays.push({ date: parsed, name });
        await setData(KEY_SETTINGS, state.settings);
        render();
      });
    }
    document.querySelectorAll('[data-remove-holiday]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const dateVal = btn.dataset.removeHoliday;
        if(!(await askConfirm('Remove this holiday from the list?', 'Remove'))) return;
        state.settings.publicHolidays = state.settings.publicHolidays.filter(h=>h.date!==dateVal);
        await setData(KEY_SETTINGS, state.settings);
        render();
      });
    });

    attachApprovalHandlers();
  }

  if(activeTab === 'admin'){
    const unlockBtn = document.getElementById('adminUnlockBtn');
    if(unlockBtn){
      unlockBtn.addEventListener('click', ()=>{
        const val = document.getElementById('adminPinInput').value;
        if(val === state.settings.adminPin){ adminUnlocked = true; render(); }
        else{ document.getElementById('adminPinError').textContent = 'Incorrect PIN.'; }
      });
    }
    const lockBtn = document.getElementById('adminLockBtn');
    if(lockBtn){
      lockBtn.addEventListener('click', ()=>{ adminUnlocked = false; render(); });
    }

    const toggleRawDataBtn = document.getElementById('toggleRawDataBtn');
    if(toggleRawDataBtn){
      toggleRawDataBtn.addEventListener('click', ()=>{
        rawDataViewerOpen = !rawDataViewerOpen;
        render();
      });
    }

    const exportDataBtn = document.getElementById('exportDataBtn');
    if(exportDataBtn){
      exportDataBtn.addEventListener('click', ()=>{
        const backup = {
          exportedAt: new Date().toISOString(),
          appVersion: APP_VERSION,
          employees: state.employees,
          attendance: state.attendance,
          swaps: state.swaps,
          leave: state.leave,
          settings: state.settings
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `amathuba-hub-backup-${toISODateLocal(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    const importDataFile = document.getElementById('importDataFile');
    if(importDataFile){
      importDataFile.addEventListener('change', async (e)=>{
        const file = e.target.files[0];

            return;

          if(!(await askConfirm('This will overwrite ALL current data with the contents of this backup. Continue?', 'Restore'))) return;
          state.employees = parsed.employees || [];
          state.attendance = parsed.attendance || [];
          state.swaps = parsed.swaps || [];
          state.leave = parsed.leave || [];
          if(parsed.settings) state.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings);
          await Promise.all([
            setData(KEY_EMPLOYEES, state.employees),
            setData(KEY_ATTENDANCE, state.attendance),
            setData(KEY_SWAPS, state.swaps),
            setData(KEY_LEAVE, state.leave),
            setData(KEY_SETTINGS, state.settings)
          ]);
          await showAlert('Backup restored successfully.');
          render();

          console.error('Import error', err);
          await showAlert('Could not read that file — make sure it\'s a valid backup JSON.');
        }
      });
    }

    const saveSettingsPinBtn = document.getElementById('saveSettingsPinBtn');
    if(saveSettingsPinBtn){
      saveSettingsPinBtn.addEventListener('click', async ()=>{

    document.querySelectorAll('[data-edit-manager]').forEach(btn=>{

        const name = btn.dataset.editManager;
        const newPin = await askPrompt(`New PIN for ${name}:`, state.settings.managers[name]);
        if(newPin === null || !newPin.trim()) return;
        state.settings.managers[name] = newPin.trim();
        await setData(KEY_SETTINGS, state.settings);
        render();
      });
    });
    document.querySelectorAll('[data-remove-manager]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const name = btn.dataset.removeManager;
        if(!(await askConfirm(`Remove manager access for ${name}?`, 'Remove'))) return;
        delete state.settings.managers[name];
        await setData(KEY_SETTINGS, state.settings);
        render();
      });
    });

    document.querySelectorAll('[data-edit-attendance]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingAttendanceId = btn.dataset.editAttendance; render(); });
    });
    document.querySelectorAll('[data-cancel-attendance]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingAttendanceId = null; render(); });
    });
    document.querySelectorAll('[data-save-attendance]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.saveAttendance;
        const rec = state.attendance.find(r=>r.id===id);
        if(!rec) return;
        rec.name = document.getElementById(`editName-${id}`).value;
        rec.type = document.getElementById(`editType-${id}`).value;
        const tsVal = document.getElementById(`editTs-${id}`).value;
        if(tsVal) rec.ts = new Date(tsVal).toISOString();
        rec.late = document.getElementById(`editLate-${id}`).checked;
        rec.reason = document.getElementById(`editReason-${id}`).value.trim() || null;
        rec.reasonStatus = document.getElementById(`editStatus-${id}`).value;
        await setData(KEY_ATTENDANCE, state.attendance);
        editingAttendanceId = null;
        render();
      });
    });
    document.querySelectorAll('[data-delete-attendance]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.deleteAttendance;
        if(!(await askConfirm('Delete this attendance record permanently?', 'Delete'))) return;
        state.attendance = state.attendance.filter(r=>r.id!==id);
        await setData(KEY_ATTENDANCE, state.attendance);
        render();
      });
    });

    document.querySelectorAll('[data-edit-swap]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSwapId = btn.dataset.editSwap; render(); });
    });
    document.querySelectorAll('[data-cancel-swap]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingSwapId = null; render(); });
    });
    document.querySelectorAll('[data-save-swap]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.saveSwap;
        const rec = state.swaps.find(s=>s.id===id);
        if(!rec) return;
        rec.name = document.getElementById(`editSwapName-${id}`).value;
        rec.fromDate = document.getElementById(`editFrom-${id}`).value;
        rec.toDate = document.getElementById(`editTo-${id}`).value;
        rec.reason = document.getElementById(`editSwapReason-${id}`).value.trim();
        rec.status = document.getElementById(`editSwapStatus-${id}`).value;
        await setData(KEY_SWAPS, state.swaps);
        editingSwapId = null;
        render();
      });
    });
    document.querySelectorAll('[data-delete-swap]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.deleteSwap;
        if(!(await askConfirm('Delete this swap request permanently?', 'Delete'))) return;
        state.swaps = state.swaps.filter(s=>s.id!==id);
        await setData(KEY_SWAPS, state.swaps);
        render();
      });
    });

    document.querySelectorAll('[data-edit-leave]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingLeaveId = btn.dataset.editLeave; render(); });
    });
    document.querySelectorAll('[data-cancel-leave]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingLeaveId = null; render(); });
    });
    if(editingLeaveId){
      const editFromEl = document.getElementById(`editLeaveFrom-${editingLeaveId}`);
      if(editFromEl) applyDateMask(editFromEl);
      const editToEl = document.getElementById(`editLeaveTo-${editingLeaveId}`);
      if(editToEl) applyDateMask(editToEl);
    }
    document.querySelectorAll('[data-save-leave]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.saveLeave;
        const rec = state.leave.find(l=>l.id===id);
        if(!rec) return;
        const fromParsed = parseDDMMYYYY(document.getElementById(`editLeaveFrom-${id}`).value);
        const toParsed = parseDDMMYYYY(document.getElementById(`editLeaveTo-${id}`).value);
        if(!fromParsed || !toParsed){
          await showAlert('Please enter both dates as DD/MM/YYYY (e.g. 27/07/2026).');
          return;
        }
        rec.name = document.getElementById(`editLeaveName-${id}`).value;
        rec.startDate = fromParsed;
        rec.endDate = toParsed;
        rec.reason = document.getElementById(`editLeaveReason-${id}`).value.trim();
        await setData(KEY_LEAVE, state.leave);
        editingLeaveId = null;
        render();
      });
    });
    document.querySelectorAll('[data-delete-leave]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.deleteLeave;
        if(!(await askConfirm('Delete this leave record permanently?', 'Delete'))) return;
        state.leave = state.leave.filter(l=>l.id!==id);
        await setData(KEY_LEAVE, state.leave);
        render();
      });
    });

    const resetBtn = document.getElementById('resetDataBtn');
    if(resetBtn){
      resetBtn.addEventListener('click', async ()=>{
        if(!(await askConfirm('This permanently deletes ALL attendance, swap, and leave records. Continue?', 'Continue'))) return;
        if(!(await askConfirm('Are you absolutely sure? This cannot be undone.', 'Yes, reset everything'))) return;
        state.attendance = [];
        state.swaps = [];
        state.leave = [];
        await setData(KEY_ATTENDANCE, state.attendance);
        await setData(KEY_SWAPS, state.swaps);
        await setData(KEY_LEAVE, state.leave);
        render();
      });
    }
  }
}

function attachApprovalHandlers(){
  document.querySelectorAll('[data-approve-late]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.approveLate;
      const rec = state.attendance.find(r=>r.id===id);
      if(rec) rec.reasonStatus = 'approved';
      await setData(KEY_ATTENDANCE, state.attendance);
      render();
    });
  });
  document.querySelectorAll('[data-reject-late]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.rejectLate;
      const rec = state.attendance.find(r=>r.id===id);
      if(rec) rec.reasonStatus = 'rejected';
      await setData(KEY_ATTENDANCE, state.attendance);
      render();
    });
  });
  document.querySelectorAll('[data-approve-swap]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.approveSwap;
      const rec = state.swaps.find(s=>s.id===id);
      if(rec){
        rec.status = 'approved';
        await setData(KEY_SWAPS, state.swaps);
        await pushNotification(`${rec.name}'s day swap (off ${fmtDate(rec.fromDate)} → in ${fmtDate(rec.toDate)}) was approved`);
      }
      render();
    });
  });
  document.querySelectorAll('[data-reject-swap]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.rejectSwap;
      const rec = state.swaps.find(s=>s.id===id);
      if(rec){
        rec.status = 'rejected';
        await setData(KEY_SWAPS, state.swaps);
        await pushNotification(`${rec.name}'s day swap (off ${fmtDate(rec.fromDate)} → in ${fmtDate(rec.toDate)}) was rejected`);
      }
      render();
    });
  });
}

// ---------------- Init ----------------
document.getElementById('modalCancelBtn').addEventListener('click', ()=>{
  closeModal(modalState.isPrompt ? null : false);
});
document.getElementById('modalConfirmBtn').addEventListener('click', ()=>{
  if(modalState.isPrompt){
    closeModal(document.getElementById('modalInput').value);
  } else {
    closeModal(true);
  }
});
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay'){
    closeModal(modalState.isPrompt ? null : false);
  }
});
document.getElementById('modalInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ closeModal(document.getElementById('modalInput').value); }
});

document.getElementById('notifBellBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('notifPanel');
  const isHidden = panel.classList.contains('hidden');
  if(isHidden){
    renderNotifPanel();
    panel.classList.remove('hidden');
    setLastSeenNotifNow();
    updateNotifBadge();
  } else {
    panel.classList.add('hidden');
  }
});
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('notifPanel');
  const bell = document.getElementById('notifBellBtn');
  if(!panel || panel.classList.contains('hidden')) return;
  if(!panel.contains(e.target) && !bell.contains(e.target)){
    panel.classList.add('hidden');
  }
});

(async function init(){
  await loadState();
  tickClock();
  render();
  startNotificationsListener();
})();
</script>
</body>
